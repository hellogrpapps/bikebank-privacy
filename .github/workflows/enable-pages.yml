name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from main root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/pages" > /tmp/pages.json; then
            echo "Pages site already exists"
            cat /tmp/pages.json
          else
            echo "Creating Pages site from branch main path /"
            gh api -X POST "repos/${REPO}/pages" \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          fi
          echo "Setting source to branch main path /"
          gh api -X PUT "repos/${REPO}/pages" \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
          echo "Requesting a Pages build"
          gh api -X POST "repos/${REPO}/pages/builds" || true
          gh api "repos/${REPO}/pages"
